# RT self-hosted appliance — local/dev composition.
#
# On a real appliance these ship as a signed bundle and the sandbox gets a
# hardened runtime (gVisor/Firecracker) with egress pinned to the policy-gate.
# This compose file is the development stand-in.
services:
  policy-gate:
    build: ../policy-gate
    # -trust is the provisioned set of operator Ed25519 public keys (hex). The
    # gate refuses to start, and refuses every target, unless scope.json is
    # signed by a key in this store. Generate keys with `rt keygen`; put the
    # .pub hex into ./scope/trust.json as a JSON array.
    command: ["-scope", "/scope/scope.json", "-trust", "/scope/trust.json", "-addr", ":8700"]
    volumes:
      - ./scope:/scope:ro
    ports:
      - "8700:8700"

  sandbox:
    build: ../sandbox
    depends_on: [policy-gate]
    # In production: run with a container runtime that can launch nested,
    # egress-controlled microVMs for each tool run.

  gateway:
    build: ../gateway
    # The production edge: auth + TLS + multi-engagement routing in front of the
    # orchestrator's `rt serve` console backends. Copy the *.example.json in
    # ./gateway to real registry.json / tokens.json (with long random tokens)
    # and mount TLS material before any real engagement.
    command: ["-addr", ":8080", "-registry", "/cfg/registry.json", "-tokens", "/cfg/tokens.json"]
    volumes:
      - ./gateway:/cfg:ro
    depends_on: [policy-gate]
    ports:
      - "8080:8080"

  orchestrator:
    build: ../orchestrator
    depends_on: [policy-gate, sandbox]
    environment:
      # Point at a locally served model so no target data leaves the appliance.
      - RT_AGENT_BIN=${RT_AGENT_BIN:-claude}
    volumes:
      - ./engagements:/engagements
# A real deployment also adds: postgres (findings + hash-chained audit log),
# neo4j (attack graph), a durable workflow engine (Temporal) for pause/resume
# across the exploit confirmation gate, and the operator console (console/).
