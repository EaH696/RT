name: CI

on:
  push:
    branches: [main, "release/**", "feat/**"]
  pull_request:
    branches: [main]

jobs:
  python:
    name: orchestrator (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install orchestrator (stdlib-only + dev extras)
        working-directory: orchestrator
        run: pip install -e ".[dev]"
      - name: Run tests
        working-directory: orchestrator
        run: python -m pytest -q

  go:
    name: policy-gate + sandbox (go test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: policy-gate
        working-directory: policy-gate
        run: go test ./...
      - name: sandbox
        working-directory: sandbox
        run: go test ./...

  e2e:
    name: end-to-end engagement harness
    runs-on: ubuntu-latest
    needs: [python, go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build services + install orchestrator
        run: make build
      - name: Run live engagement harness
        run: python tests/integration/run_engagement.py
